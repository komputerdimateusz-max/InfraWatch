# =========================================================
# FILE: pyproject.toml
# =========================================================
[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "infrawatch"
version = "0.1.0"
description = "Decision-driven Earth Observation analytics for vegetation risk near traction & power networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "InfraWatch" }]
dependencies = [
  "folium>=0.15",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "rich>=13.7",
  "shapely>=2.0",
  "streamlit>=1.36",
  "streamlit-folium>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infrawatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
